name: Publish to GitHub Packages

on:
    push:
        tags:
            - "v[0-9]*"
    workflow_dispatch:
        inputs:
            package_version:
                description: Package version for the selected branch, e.g. 0.1.0-alpha.1 (no build metadata).
                required: true
                type: string

permissions:
    contents: read

env:
    CONTROLS_PROJECT_PATH: src/SmoothScroll.Avalonia.Controls/SmoothScroll.Avalonia.Controls.csproj
    INTERACTION_PROJECT_PATH: src/SmoothScroll.Avalonia.Interaction/SmoothScroll.Avalonia.Interaction.csproj
    PACKAGE_OUTPUT_DIR: artifacts/nuget
    NUGET_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Resolve package version
              shell: bash
              env:
                  REQUESTED_VERSION: ${{ inputs.package_version }}
              run: |
                  set -euo pipefail

                  if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
                    version="${GITHUB_REF_NAME#v}"
                  else
                    version="$REQUESTED_VERSION"
                  fi

                  numeric='(0|[1-9][0-9]*)'
                  identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
                  version_pattern="^$numeric\.$numeric\.$numeric(-$identifier(\.$identifier)*)?$"
                  if [[ ! "$version" =~ $version_pattern ]]; then
                    echo "::error::Provide a SemVer package version without build metadata, e.g. 0.1.0-alpha.1."
                    exit 1
                  fi

                  echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
                  echo "Publishing $version from $GITHUB_REF at $(git rev-parse HEAD)"

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: |
                      8.0.x
                      10.0.x

            - name: Restore Controls
              run: dotnet restore "$CONTROLS_PROJECT_PATH" -p:PackageVersion="$PACKAGE_VERSION"

            - name: Pack Controls
              run: >
                  dotnet pack "$CONTROLS_PROJECT_PATH"
                  --configuration Release
                  --no-restore
                  -p:PackageVersion="$PACKAGE_VERSION"
                  -p:RepositoryCommit="$GITHUB_SHA"
                  --output "$PACKAGE_OUTPUT_DIR"

            - name: Pack Interaction
              run: >
                  dotnet pack "$INTERACTION_PROJECT_PATH"
                  --configuration Release
                  --no-restore
                  -p:PackageVersion="$PACKAGE_VERSION"
                  -p:RepositoryCommit="$GITHUB_SHA"
                  --output "$PACKAGE_OUTPUT_DIR"

            - name: Upload package artifact
              uses: actions/upload-artifact@v4
              with:
                  name: Shirasagi0012.SmoothScroll.Avalonia.${{ env.PACKAGE_VERSION }}
                  path: ${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg
                  if-no-files-found: error

            - name: Push to GitHub Packages
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: >
                  dotnet nuget push "$PACKAGE_OUTPUT_DIR/*.nupkg"
                  --source "$NUGET_SOURCE"
                  --api-key "$GITHUB_TOKEN"
